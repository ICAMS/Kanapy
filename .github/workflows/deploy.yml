name: PyPI Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build backend and twine
        run: python -m pip install --upgrade build twine

      - name: Clean old builds
        run: rm -rf dist build *.egg-info

      - name: Build sdist/wheel
        run: python -m build
        
      - name: Check distribution metadata
        run: twine check dist/*

      - name: Smoke test wheel
        working-directory: /tmp
        run: |
          python -m venv kanapy-wheel-test
          ./kanapy-wheel-test/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          ./kanapy-wheel-test/bin/python -c "import kanapy; print(kanapy.__version__)"
  
      - name: Upload to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

